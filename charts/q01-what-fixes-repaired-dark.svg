<svg xmlns="http://www.w3.org/2000/svg" width="760" height="218" viewBox="0 0 760 218" role="img" aria-label="What each of the 300 sampled fixes repaired, by the first readers&#x27; rule">
<title>What each of the 300 sampled fixes repaired, by the first readers&#x27; rule</title>
<text x="0.0" y="16" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">New code that never worked</text>
