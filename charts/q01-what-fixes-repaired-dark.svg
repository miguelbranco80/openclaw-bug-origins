<text x="464.4" y="118" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 13–22% of all fixes</text>
<text x="0.0" y="142" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Old code that broke because something outside changed</text>
<rect x="0" y="150" width="430" height="10" rx="2" fill="#2c2c2a"/>
