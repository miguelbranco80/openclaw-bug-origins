<text x="440.0" y="160" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">29</text>
<text x="464.4" y="160" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 7–14% of all fixes</text>
<text x="0.0" y="184" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Could not tell</text>
<rect x="0" y="192" width="430" height="10" rx="2" fill="#2c2c2a"/>
