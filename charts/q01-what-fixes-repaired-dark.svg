<svg xmlns="http://www.w3.org/2000/svg" width="760" height="218" viewBox="0 0 760 218" role="img" aria-label="What each of the 300 sampled fixes repaired, by the first readers&#x27; rule">
<title>What each of the 300 sampled fixes repaired, by the first readers&#x27; rule</title>
<text x="0.0" y="16" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">New code that never worked</text>
<rect x="0" y="24" width="520" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,24 H516.0 Q520.0,24 520.0,28 V30 Q520.0,34 516.0,34 H0 Z" fill="#3987e5"/>
<text x="530.0" y="34" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">105</text>
<text x="562.6" y="34" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 30–41% of all fixes</text>
<text x="0.0" y="58" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Not a bug: redesign, speed-up, wording or tooling</text>
<rect x="0" y="66" width="520" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,66 H491.2 Q495.2,66 495.2,70 V72 Q495.2,76 491.2,76 H0 Z" fill="#3987e5"/>
<text x="530.0" y="76" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">100</text>
<text x="562.6" y="76" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 28–39% of all fixes</text>
<text x="0.0" y="100" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A working thing that a later change broke</text>
<rect x="0" y="108" width="520" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,108 H248.6 Q252.6,108 252.6,112 V114 Q252.6,118 248.6,118 H0 Z" fill="#3987e5"/>
<text x="530.0" y="118" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">51</text>
<text x="554.4" y="118" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 13–22% of all fixes</text>
<text x="0.0" y="142" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Old code that broke because something outside changed</text>
<rect x="0" y="150" width="520" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,150 H139.6 Q143.6,150 143.6,154 V156 Q143.6,160 139.6,160 H0 Z" fill="#3987e5"/>
<text x="530.0" y="160" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">29</text>
<text x="554.4" y="160" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 7–14% of all fixes</text>
<text x="0.0" y="184" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Could not tell</text>
<rect x="0" y="192" width="520" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,192 H70.3 Q74.3,192 74.3,196 V198 Q74.3,202 70.3,202 H0 Z" fill="#3987e5"/>
<text x="530.0" y="202" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">15</text>
<text x="554.4" y="202" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">plausibly 3–8% of all fixes</text>
