<svg xmlns="http://www.w3.org/2000/svg" width="760" height="152" viewBox="0 0 760 152" role="img" aria-label="How much of the time the bug was new code that never worked, by three ways of counting">
<title>How much of the time the bug was new code that never worked, by three ways of counting</title>
<text x="215.0" y="11" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">half</text>
<line x1="215.0" y1="16" x2="215.0" y2="148" stroke="#898781" stroke-width="1" stroke-dasharray="3 3"/>
<text x="0.0" y="34" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">First readers, counting every bug they traced</text>
<rect x="0" y="42" width="430" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,42 H284.1 Q288.1,42 288.1,46 V48 Q288.1,52 284.1,52 H0 Z" fill="#3987e5"/>
<text x="440.0" y="52" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">67%</text>
<text x="472.6" y="52" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">105 never worked, 51 broken later</text>
<text x="0.0" y="76" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">First readers, counting only bugs where they were sure of the cause</text>
<rect x="0" y="84" width="430" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,84 H236.8 Q240.8,84 240.8,88 V90 Q240.8,94 236.8,94 H0 Z" fill="#3987e5"/>
<text x="440.0" y="94" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">56%</text>
<text x="472.6" y="94" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">30 never worked, 24 broken later</text>
<text x="0.0" y="118" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A second model, on the 60 fixes it re-read</text>
<rect x="0" y="126" width="430" height="10" rx="2" fill="#2c2c2a"/>
<path d="M0,126 H202.4 Q206.4,126 206.4,130 V132 Q206.4,136 202.4,136 H0 Z" fill="#3987e5"/>
<text x="440.0" y="136" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">48%</text>
<text x="472.6" y="136" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">16 never worked, 17 broken later</text>
</svg>
